---
include:
  # Raii builds
  - board: nice_nano//zmk
    shield: cradio_left
  - board: nice_nano//zmk
    shield: cradio_right

  # Urchin builds
  - board: nice_nano//zmk
    shield: urchin_left nice_view_adapter nice_view_gem
  - board: nice_nano//zmk
    shield: urchin_right nice_view_adapter nice_view_gem

  # Corne builds
  - board: nice_nano//zmk
    shield: corne_left nice_view_adapter nice_view
  - board: nice_nano//zmk
    shield: corne_right nice_view_adapter nice_view

  # Crosses builds
  - board: nice_nano//zmk
    shield: crosses_left
  - board: nice_nano//zmk
    shield: crosses_right

  # Viginti builds
  - board: nice_nano//zmk
    shield: viginti_left
  - board: nice_nano//zmk
    shield: viginti_right

  # Settings reset
  - board: nice_nano//zmk
    shield: settings_reset

  # Dongle builds
  - board: nice_nano//zmk
    shield: cradio_dongle
    artifact-name: raii_dongle
  - board: nice_nano//zmk
    shield: cradio_left
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: raii_left_peripheral

  - board: nice_nano//zmk
    shield: urchin_dongle
    artifact-name: urchin_dongle
  - board: nice_nano//zmk
    shield: urchin_left nice_view_adapter nice_view_gem
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: urchin_left_peripheral

  - board: nice_nano//zmk
    shield: corne_dongle
    artifact-name: corne_dongle
  - board: nice_nano//zmk
    shield: corne_left nice_view_adapter nice_view
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: corne_left_peripheral

  - board: nice_nano//zmk
    shield: crosses_dongle
    artifact-name: crosses_dongle
  - board: nice_nano//zmk
    shield: crosses_right
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: crosses_right_peripheral

  - board: nice_nano//zmk
    shield: viginti_dongle
    artifact-name: viginti_dongle
  - board: nice_nano//zmk
    shield: viginti_left
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: viginti_left_peripheral
