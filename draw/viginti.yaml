layout:
  zmk_keyboard: viginti
layers:
  Base1:
    - t: A
      h: LCMD
    - t: S
      h: $$mdi:apple-keyboard-option$$
    - t: D
      h: $$mdi:apple-keyboard-shift$$
    - t: F
      h: $$mdi:apple-keyboard-control$$
    - t: J
      h: $$mdi:apple-keyboard-control$$
    - t: K
      h: $$mdi:apple-keyboard-shift$$
    - t: L
      h: $$mdi:apple-keyboard-option$$
    - t: ''''
      h: RCMD
      s: '"'
    - Z
    - X
    - C
    - V
    - M
    - t: ','
      s: ;
    - t: .
      s: ':'
    - t: '?'
      s: '!'
    - Num
    - $$mdi:apple-keyboard-shift$$
    - Base2
    - t: $$mdi:keyboard-space$$
      h: Sym
  Base2:
    - Q
    - W
    - E
    - R
    - U
    - I
    - O
    - P
    - T
    - G
    - B
    - $$mdi:apple-keyboard-shift$$
    - $$mdi:apple-keyboard-shift$$
    - N
    - H
    - Y
    - t: ▽
      type: trans
    - t: ▽
      type: trans
    - type: held
    - t: ▽
      type: trans
  Alpha1:
    - t: N
      h: LCMD
    - t: R
      h: $$mdi:apple-keyboard-option$$
    - t: T
      h: $$mdi:apple-keyboard-shift$$
    - t: S
      h: $$mdi:apple-keyboard-control$$
    - t: H
      h: $$mdi:apple-keyboard-control$$
    - t: A
      h: $$mdi:apple-keyboard-shift$$
    - t: E
      h: $$mdi:apple-keyboard-option$$
    - t: I
      h: RCMD
    - X
    - Q
    - M
    - W
    - F
    - t: ''''
      s: '"'
    - ;
    - t: .
      s: ':'
    - Num
    - $$mdi:apple-keyboard-shift$$
    - Alpha2
    - t: $$mdi:keyboard-space$$
      h: Sym
  Alpha2:
    - B
    - L
    - D
    - C
    - Y
    - O
    - U
    - t: ','
      s: ;
    - V
    - G
    - Z
    - $$mdi:apple-keyboard-shift$$
    - $$mdi:apple-keyboard-shift$$
    - K
    - P
    - J
    - t: ▽
      type: trans
    - t: ▽
      type: trans
    - type: held
    - t: ▽
      type: trans
  Num:
    - F8
    - '7'
    - '8'
    - '9'
    - '4'
    - '5'
    - '6'
    - t: F10
      h: F12
    - F7
    - t: F1
      h: F4
    - t: F2
      h: F5
    - t: F3
      h: F6
    - '1'
    - '2'
    - '3'
    - t: F9
      h: F11
    - type: held
    - t: ▽
      type: trans
    - '0'
    - t: ▽
      type: trans
  Sym:
    - t: '~'
      h: $$mdi:apple-keyboard-command$$
    - t: \
      h: $$mdi:apple-keyboard-option$$
    - t: /
      h: $$mdi:apple-keyboard-shift$$
    - t: '&'
      h: $$mdi:apple-keyboard-control$$
    - $$mdi:arrow-left-bold$$
    - $$mdi:arrow-down-bold$$
    - $$mdi:arrow-up-bold$$
    - $$mdi:arrow-right-bold$$
    - '`'
    - <
    - '>'
    - '*'
    - t: '['
      h: '{'
    - (
    - )
    - t: ']'
      h: '}'
    - _
    - '-'
    - '='
    - type: held
  Nav:
    - t: Alpha1
      h: toggle
    - $$mdi:volume-off$$
    - $$mdi:volume-high$$
    - $$mdi:play-pause$$
    - h: '1'
      s: $$mdi:bluetooth-connect$$
    - h: '2'
      s: $$mdi:bluetooth-connect$$
    - h: '3'
      s: $$mdi:bluetooth-connect$$
    - $$mdi:bluetooth-off$$
    - $$mdi:progress-download$$
    - $$mdi:skip-previous$$
    - $$mdi:volume-low$$
    - $$mdi:skip-next$$
    - $$mdi:lock$$
    - ''
    - ''
    - $$mdi:progress-download$$
    - type: held
    - t: ▽
      type: trans
    - t: ▽
      type: trans
    - type: held
combos:
  - p:
      - 2
      - 1
    k: $$escape$$
    l:
      - Base1
      - Base2
      - Alpha1
      - Alpha2
      - Sym
  - p:
      - 3
      - 2
    k: $$mdi:keyboard-tab$$
    l:
      - Base1
      - Base2
      - Alpha1
      - Alpha2
      - Sym
  - p:
      - 4
      - 5
    k:
      t: $$mdi:keyboard-return$$
      type: enter
    l:
      - Base1
      - Base2
      - Alpha1
      - Alpha2
      - Num
  - p:
      - 5
      - 6
    k: $$escape$$
    l:
      - Base1
      - Base2
      - Alpha1
      - Alpha2
      - Num
  - p:
      - 12
      - 13
    k:
      t: $$mdi:backspace$$
      type: backspace
    l:
      - Base1
      - Base2
      - Alpha1
      - Alpha2
      - Num
      - Sym
  - p:
      - 13
      - 14
    k:
      t: AltGr+$$mdi:backspace$$
      type: backspace
    l:
      - Base1
      - Base2
      - Alpha1
      - Alpha2
      - Num
      - Sym
  - p:
      - 2
      - 5
    k: $$mdi:apple-keyboard-caps$$
    l:
      - Base1
      - Base2
      - Alpha1
      - Alpha2
  - p:
      - 16
      - 19
    k: Nav
    l:
      - Base1
      - Alpha1
  - p:
      - 4
      - 12
    k: $$mdi:code-parentheses$$
    l:
      - Base1
      - Base2
      - Alpha1
      - Alpha2
  - p:
      - 5
      - 13
    k: $$mdi:code-brackets$$
    l:
      - Base1
      - Base2
      - Alpha1
      - Alpha2
  - p:
      - 6
      - 14
    k: $$mdi:code-braces$$
    l:
      - Base1
      - Base2
      - Alpha1
      - Alpha2
